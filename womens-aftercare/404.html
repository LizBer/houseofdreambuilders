<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>That page is not here</title>
<meta name="description" content="That page is not here. Go back to Tend Aftercare.">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper: oklch(96.5% 0.018 60); --ink: oklch(26% 0.05 40); --soft: oklch(48% 0.05 42); --accent: oklch(52% 0.16 36); --font: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.6 var(--font); text-align: center; padding: 24px; }
  h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 500; letter-spacing: -0.03em; line-height: 1.1; max-width: 16ch; }
  p { margin: 0 auto; color: var(--soft); max-width: 40ch; }
  a { display: inline-flex; align-items: center; min-height: 48px; margin-top: 28px; padding: 0 24px; border-radius: 999px; background: var(--accent); color: oklch(98% 0.012 80); text-decoration: none; font-weight: 500; }
  a:hover { background: var(--ink); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>That page is not here.</h1>
  <p>Nothing is lost. Take the way back and we will start again.</p>
  <a href="/">Back to the beginning</a>
</main>
</body>
</html>
